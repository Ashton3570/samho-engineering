<section class="logo-opening" id="logo-opening" aria-label="삼호엔지니어링 로고 오프닝" tabindex="-1" hidden>
  <div class="logo-mark" aria-hidden="true">{{LOGO_SVG}}</div>
  <div class="logo-caption"><p>삼호엔지니어링</p><span>SAMHO ENGINEERING</span></div>
</section>
<aside class="logo-review" aria-label="로고 오프닝 시안 도구">
  <div class="logo-toolbar"><span class="logo-review-title">로고 오프닝 <span>4.5초</span></span><button id="logo-replay" type="button">다시 재생 ↻</button><button id="logo-inspect" type="button" aria-expanded="false" aria-controls="logo-controls">장면 보기</button><a href="/">현재 사이트 ↗</a></div>
  <div id="logo-controls" hidden>
    <div class="logo-scenes"><button type="button" data-scene="700">큰 윤곽</button><button type="button" data-scene="1900">로고 완성 중</button><button type="button" data-scene="3500">상호명 등장</button><button id="logo-slow" type="button">천천히 재생</button></div>
    <label class="logo-timeline">장면 탐색 <input id="logo-timeline" type="range" min="0" max="4500" step="10" value="4500"><output id="logo-time" for="logo-timeline">4.50초</output></label>
    <p>짙은 파란색 원본 로고 · 2.75초부터 상호명 표시</p>
  </div>
</aside>
<p class="sr-only" id="logo-status" role="status" aria-live="polite"></p>
