<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>삼호 · 히어로 디자인 4가지</title><style>
*{box-sizing:border-box}body{margin:0;color:#253247;background:#edf0f4;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;letter-spacing:-.03em}button,a{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.review-head{background:#fff;padding:25px 32px 0;border-bottom:1px solid #dce3eb}.top{display:flex;align-items:center;justify-content:space-between;gap:25px}.kicker{font-size:10px;color:#3865b1;font-weight:650;letter-spacing:.14em;margin:0 0 7px}h1{font-size:23px;margin:0;font-weight:650}.home-link{font-size:12px;color:#667588;white-space:nowrap}.tabs{display:flex;gap:26px;margin-top:24px;overflow:auto}.tabs button{border:0;border-bottom:3px solid transparent;background:transparent;padding:0 0 15px;color:#7a8696;font-size:13px;white-space:nowrap}.tabs button[aria-pressed=true]{color:#1e2083;border-color:#1e2083;font-weight:650}.tabs span{margin-right:6px;font-size:11px}.direction{padding:20px 32px;display:flex;justify-content:space-between;gap:30px;align-items:center;background:#fff}.direction strong{display:block;font-size:16px;margin-bottom:7px}.direction p{font-size:13px;color:#6c798c;line-height:1.65;margin:0;max-width:800px}.tools{display:flex;gap:8px;align-items:center;flex-shrink:0}.tools button,.tools a{border:1px solid #d9e0e9;background:#fff;border-radius:8px;padding:9px 12px;font-size:12px;white-space:nowrap}.tools button[aria-pressed=true]{background:#253247;color:#fff;border-color:#253247}.stage{padding:22px 24px 30px;display:flex;justify-content:center}.device{width:100%;background:white;box-shadow:0 8px 30px #1d355416;transition:width .2s;overflow:hidden}iframe{display:block;width:100%;height:calc(100svh - 245px);min-height:660px;border:0;background:white}.device.mobile{width:390px;border:7px solid #253247;border-radius:28px}.device.mobile iframe{height:844px;min-height:0}.foot{padding:0 32px 28px;font-size:12px;line-height:1.8;color:#748094}.foot p{margin:0 0 5px}button:focus-visible,a:focus-visible{outline:3px solid #4b90ef;outline-offset:4px}@media(max-width:900px){.direction{align-items:flex-start;flex-direction:column;gap:15px}.review-head{padding:20px 20px 0}.direction{padding:18px 20px}.tabs{gap:20px}.stage{padding:16px 12px}.foot{padding:0 20px 24px}iframe{min-height:740px}.tools{flex-wrap:wrap}.top{align-items:flex-start}h1{font-size:20px}}@media(max-width:500px){.home-link{font-size:10px}.kicker{font-size:9px}.tabs{gap:18px}.tabs button{font-size:12px}.device.mobile{width:100%;max-width:390px}.tools button{display:none}.tools a{padding:9px 13px}.stage{padding:12px 0}.direction p{font-size:12px}.device{box-shadow:none}.device.mobile{border:0;border-radius:0}}@media(prefers-reduced-motion:reduce){.device{transition:none}}
</style></head><body><header class="review-head"><div class="top"><div><p class="kicker">SAMHO ENGINEERING · HERO STUDY</p><h1>사진을 더 크게, 네 가지 방향.</h1></div><a class="home-link" href="/">현재 홈페이지 ↗</a></div><nav class="tabs" aria-label="히어로 디자인 선택"><button data-id="01" aria-pressed="true"><span>01</span>풀스크린 몰입형</button><button data-id="02" aria-pressed="false"><span>02</span>제품 갤러리형</button><button data-id="03" aria-pressed="false"><span>03</span>와이드 에디토리얼형</button><button data-id="04" aria-pressed="false"><span>04</span>확장 분할형</button></nav></header><section class="direction"><div><strong id="tag">사진을 배경으로, 문구는 크게</strong><p id="description">이전 SKF 참고 시안에 가장 가까운 방향입니다.</p></div><div class="tools"><button id="desktop" aria-pressed="true">PC</button><button id="mobile" aria-pressed="false">모바일</button><a id="full" href="01-immersive.html" target="_blank" rel="noopener">전체 화면으로 보기 ↗</a></div></section><main class="stage"><div id="device" class="device"><iframe id="preview" src="01-immersive.html" title="01 풀스크린 몰입형 미리보기"></iframe></div></main><footer class="foot"><p id="tradeoff"></p><p>동일한 블루 이미지와 회사 문구를 사용한 로컬 비교 시안입니다. 현재 홈페이지에는 아직 적용하지 않았습니다.</p></footer><script>
const variants=__VARIANTS__;const preview=document.querySelector('#preview'),device=document.querySelector('#device');
function select(id,update=true){const item=variants.find(v=>v.id===id)||variants[0];document.querySelectorAll('[data-id]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.id===item.id)));document.querySelector('#tag').textContent=item.tag;document.querySelector('#description').textContent=item.description;document.querySelector('#tradeoff').textContent=item.tradeoff;document.querySelector('#full').href=item.file;preview.title=item.id+' '+item.title+' 미리보기';if(preview.getAttribute('src')!==item.file)preview.src=item.file;if(update)history.replaceState(null,'','?design='+item.id)}
document.querySelectorAll('[data-id]').forEach(b=>b.addEventListener('click',()=>select(b.dataset.id)));select(new URLSearchParams(location.search).get('design'),false);
for(const mode of ['desktop','mobile'])document.querySelector('#'+mode).onclick=()=>{device.classList.toggle('mobile',mode==='mobile');document.querySelector('#desktop').setAttribute('aria-pressed',String(mode==='desktop'));document.querySelector('#mobile').setAttribute('aria-pressed',String(mode==='mobile'))};
</script></body></html>
